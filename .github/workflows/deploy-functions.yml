name: Deploy Cloud Functions

on:
  push:
    branches: [ main ]

jobs:
  deploy-functions:
    name: Deploy functions on push to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache functions node modules
        uses: actions/cache@v4
        with:
          path: functions/node_modules
          key: ${{ runner.os }}-functions-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-functions-

      - name: Install functions dependencies
        working-directory: ./functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase functions config (SendGrid)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SENDGRID_KEY: ${{ secrets.SENDGRID_KEY }}
          SENDGRID_FROM: ${{ secrets.SENDGRID_FROM }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then echo "FIREBASE_TOKEN is not set"; exit 1; fi
          # Set config using provided secrets
          firebase functions:config:set sendgrid.key="$SENDGRID_KEY" sendgrid.from="$SENDGRID_FROM" --project "$FIREBASE_PROJECT" --token "$FIREBASE_TOKEN"

      - name: Deploy functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then echo "FIREBASE_TOKEN is not set"; exit 1; fi
          firebase deploy --only functions --project "$FIREBASE_PROJECT" --token "$FIREBASE_TOKEN"
